<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>To-Do List</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="app">
		<section class="card" aria-labelledby="titulo-principal">
			<p class="eyebrow">ATIVIDADE  AULA 6</p>
			<h1 id="titulo-principal">To-Do List</h1>
			<p class="subtitle">Adicione tarefas, marque como concluídas e clique no item para removê-lo.</p>

			<form id="task-form" class="task-form" autocomplete="off">
				<label class="sr-only" for="task-input">Digite uma tarefa</label>
				<input id="task-input" name="task" type="text" placeholder="Digite uma tarefa" maxlength="80">
				<button type="submit">Adicionar</button>
			</form>

			<ul id="task-list" class="task-list" aria-live="polite"></ul>
		</section>
	</main>

	<script src="script.js"></script>
</body>
</html>
